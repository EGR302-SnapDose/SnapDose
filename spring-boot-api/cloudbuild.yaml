steps:
  # Build the Docker image
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-t'
      - 'us-central1-docker.pkg.dev/egr302-snapdose/snapdose-api/snapdose-api:latest'
      - '-t'
      - 'us-central1-docker.pkg.dev/egr302-snapdose/snapdose-api/snapdose-api:$SHORT_SHA'
      - '.'
    
  # Push the image to Artifact Registry
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - 'us-central1-docker.pkg.dev/egr302-snapdose/snapdose-api/snapdose-api:latest'
  
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - 'us-central1-docker.pkg.dev/egr302-snapdose/snapdose-api/snapdose-api:$SHORT_SHA'
  
  # Deploy to Cloud Run
  - name: 'gcr.io/cloud-builders/gcloud'
    args:
      - 'run'
      - 'deploy'
      - 'snapdose-api'
      - '--image=us-central1-docker.pkg.dev/egr302-snapdose/snapdose-api/snapdose-api:$SHORT_SHA'
      - '--platform=managed'
      - '--region=us-central1'
      - '--allow-unauthenticated'
      - '--memory=512Mi'
      - '--cpu=1'
      - '--min-instances=0'
      - '--max-instances=3'
      - '--port=8080'
      - '--set-env-vars=GOOGLE_CLOUD_PROJECT=egr302-snapdose'
      - '--project=egr302-snapdose'

images:
  - 'us-central1-docker.pkg.dev/egr302-snapdose/snapdose-api/snapdose-api:latest'
  - 'us-central1-docker.pkg.dev/egr302-snapdose/snapdose-api/snapdose-api:$SHORT_SHA'

options:
  machineType: 'E2_HIGHCPU_8'
  logging: CLOUD_LOGGING_ONLY

timeout: '1800s'
